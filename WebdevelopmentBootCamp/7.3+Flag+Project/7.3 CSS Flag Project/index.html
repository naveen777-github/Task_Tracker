<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CSS Flag Project</title>
    <style>
      /* Write your CSS Code here */
      .flag > p {
        margin: 0;
        padding: 0;
        text-align: center;
        background-color: red;
        height: 400px;
        width: 600px;
        color: white;
        position: relative;
      }

      .flag div > div {
        background-color: blueviolet;
        height: 200px;
        width: 600px;
        margin: 0;
        padding: 0;
        position: absolute;
        bottom: 70%;
        top: 10%;
      }
      .flag div > div p {
        background-color: blue;
        text-align: center;
        border-radius: 100%;
        height: 200px;
        width: 150px;
        color: black;
        position: absolute;
        top: 20%;
        left: 35%;
        right: 80%;
      }
    </style>
  </head>

  <!-- 
  IMPORTANT! Do not change any HTML
Don't add any classes/ids/elements 
Use what you know about combining selectors 
and CSS specificity instead.
Hint 1: The flag is 900px by 600px and the circle is 200px by 200px.
Hint 2: You can use CSS inspection to get the colors from
https://appbrewery.github.io/flag-of-laos/
-->

  <body>
    <div class="flag">
      <p>The Flag</p>
      <div>
        <div>
          <p>of Laos</p>
        </div>
      </div>
    </div>
  </body>
</html>
